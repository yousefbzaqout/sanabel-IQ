name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    name: Tests (PHP 8.5)
    runs-on: ubuntu-latest

    services:
      pgsql:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_pgsql, tokenizer, xml, curl, redis
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

      # Placeholder: frontend linting / static analysis (e.g. PHPStan, Pint, ESLint)
      # - name: Static analysis
      #   run: vendor/bin/phpstan analyse
      # - name: Frontend lint
      #   run: npm ci && npm run lint
